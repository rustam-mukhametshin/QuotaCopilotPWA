<div
  class="confirm-dialog__overlay"
  (click)="cancelled.emit()"
  (keydown.escape)="onEscape($event)"
  animate.enter="anim-fade-in"
  animate.leave="anim-fade-out"
>
  <div
    class="confirm-dialog__dialog"
    role="alertdialog"
    aria-modal="true"
    [attr.aria-labelledby]="titleId"
    [attr.aria-describedby]="messageId"
    (click)="onDialogClick($event)"
    animate.enter="anim-scale-in"
  >
    <h2 [id]="titleId" class="h5">{{ title() }}</h2>
    <p [id]="messageId">{{ message() }}</p>
    <div class="confirm-dialog__footer">
      <button #cancelButton type="button" class="btn btn-secondary" (click)="cancelled.emit()">
        {{ cancelLabel() }}
      </button>
      <button type="button" class="btn" [class]="'btn-' + confirmVariant()" (click)="confirmed.emit()">
        {{ confirmLabel() }}
      </button>
    </div>
  </div>
</div>
