<div class="sidebar d-flex flex-column gap-3">
  <div class="d-flex flex-column gap-1">
    <label
      class="form-label"
      for="total-ai-credits"
      [attr.data-bs-title]="'sidebar.totalAiCreditsTooltip' | translate"
    >
      {{ 'sidebar.totalAiCredits' | translate }}
    </label>
    @if (isLoading()) {
      <div class="placeholder-glow">
        <div class="placeholder" style="height: 38px"></div>
      </div>
    } @else {
      <input
        id="total-ai-credits"
        type="number"
        class="form-control tabular-nums"
        [class.is-default-value]="store.isDefaultTotalAiCredits()"
        [value]="store.totalAiCredits() ?? ''"
        (input)="onTotalAiCreditsInput($event)"
        [attr.aria-describedby]="store.isDefaultTotalAiCredits() ? 'total-ai-credits-hint' : null"
        animate.enter="anim-fade-in"
      />
      @if (store.isDefaultTotalAiCredits()) {
        <small
          id="total-ai-credits-hint"
          class="form-text text-success"
          animate.enter="anim-fade-in"
        >
          {{ 'sidebar.defaultCreditsHint' | translate }}
        </small>
      }
    }
  </div>
  <div class="d-flex flex-column gap-1">
    <label class="form-label" for="per-day-credits">{{ 'sidebar.perDay' | translate }}</label>
    @if (isLoading()) {
      <div class="placeholder-glow">
        <div class="placeholder" style="height: 38px"></div>
      </div>
    } @else {
      <input
        id="per-day-credits"
        type="text"
        class="form-control tabular-nums"
        [value]="getPerDayCreditsDisplay()"
        readonly
        animate.enter="anim-fade-in"
      />
    }
  </div>
  <button
    class="btn btn-primary"
    [disabled]="!store.hasUnsavedChanges() || isSaving() || isLoading()"
    (click)="onSave()"
  >
    {{ (isSaving() ? 'sidebar.saving' : 'sidebar.save') | translate }}
  </button>

  @if (showToast()) {
    <div
      class="toast-container position-fixed top-0 end-0 p-3"
      style="z-index: 11"
      animate.enter="anim-slide-in-right"
      animate.leave="anim-slide-out-right"
    >
      <div class="toast show" role="alert">
        <div class="toast-header">
          <strong class="me-auto">✓ {{ 'sidebar.savedSuccess' | translate }}</strong>
          <button
            type="button"
            class="btn-close"
            (click)="hideToast()"
            [attr.aria-label]="'sidebar.closeToast' | translate"
          ></button>
        </div>
        <div class="toast-body">{{ 'sidebar.dataChanged' | translate }}</div>
      </div>
    </div>
  }
</div>
