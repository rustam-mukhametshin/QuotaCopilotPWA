<div class="sidebar d-flex flex-column gap-3">
  <div class="d-flex flex-column gap-1">
    <label class="form-label" for="total-ai-credits">Total AI credits</label>
    @if (isLoading()) {
      <div class="placeholder-glow">
        <div class="placeholder" style="height: 38px"></div>
      </div>
    } @else {
      <input
        id="total-ai-credits"
        type="number"
        class="form-control"
        [value]="store.totalAiCredits() ?? ''"
        (input)="onTotalAiCreditsInput($event)"
      />
    }
  </div>
  <div class="d-flex flex-column gap-1">
    <label class="form-label" for="per-day-credits">Per day</label>
    @if (isLoading()) {
      <div class="placeholder-glow">
        <div class="placeholder" style="height: 38px"></div>
      </div>
    } @else {
      <input
        id="per-day-credits"
        type="text"
        class="form-control"
        [value]="store.perDayCreditsRounded() ?? '—'"
        readonly
      />
    }
  </div>
  <button
    class="btn btn-primary"
    [disabled]="!store.hasUnsavedChanges() || isSaving() || isLoading()"
    (click)="onSave()"
  >
    {{ isSaving() ? 'Saving...' : 'Save' }}
  </button>

  @if (showToast()) {
    <div class="toast-container position-fixed top-0 end-0 p-3" style="z-index: 11">
      <div class="toast show" role="alert">
        <div class="toast-header">
          <strong class="me-auto">✓ Success</strong>
          <button
            type="button"
            class="btn-close"
            (click)="hideToast()"
            aria-label="Close toast"
          ></button>
        </div>
        <div class="toast-body">Data saved successfully</div>
      </div>
    </div>
  }
</div>
