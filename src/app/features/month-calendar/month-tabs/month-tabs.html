<div class="month-tabs d-flex gap-2 align-items-center">
  @for (tab of store.tabs(); track tab.key) {
    <div class="month-tabs__tab-wrapper">
      <button
        class="month-tabs__tab btn btn-sm"
        [class.btn-primary]="store.activeKey() === tab.key"
        [class.btn-outline-secondary]="store.activeKey() !== tab.key"
        (click)="onTabClick(tab.key)"
      >
        {{ tab.label }}▾
      </button>
      <button
        type="button"
        class="month-tabs__tab-actions-btn btn btn-sm btn-outline-secondary"
        (click)="toggleActionsMenu(tab.key, $event)"
      >
        ⋮
      </button>
      @if (openMenuKey() === tab.key) {
        <div class="month-tabs__actions-menu">
          <button
            type="button"
            class="month-tabs__delete-btn btn btn-sm btn-link text-danger"
            (click)="onDeleteClick(tab, $event)"
          >
            Удалить
          </button>
        </div>
      }
    </div>
  }
  <button
    class="month-tabs__add-btn btn btn-sm btn-outline-secondary"
    (click)="togglePicker()"
    type="button"
  >
    +
  </button>
  @if (showPicker()) {
    <input
      type="month"
      class="month-tabs__picker form-control form-control-sm"
      (change)="onPickerChange($event)"
    />
  }
  @if (pendingDeleteTab(); as tab) {
    <div class="month-tabs__confirm-overlay" (click)="cancelDelete()">
      <div class="month-tabs__confirm-modal" (click)="onModalContentClick($event)">
        <p class="month-tabs__confirm-text">Удалить вкладку {{ tab.label }}?</p>
        <div class="month-tabs__confirm-actions">
          <button
            type="button"
            class="month-tabs__confirm-cancel-btn btn btn-sm btn-outline-secondary"
            (click)="cancelDelete()"
          >
            Отмена
          </button>
          <button
            type="button"
            class="month-tabs__confirm-delete-btn btn btn-sm btn-danger"
            (click)="confirmDelete()"
          >
            Удалить
          </button>
        </div>
      </div>
    </div>
  }
</div>
