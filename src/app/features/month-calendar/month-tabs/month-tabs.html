<div class="month-tabs d-flex gap-2 align-items-center">
  @for (tab of store.tabs(); track tab.key) {
    <div
      class="month-tabs__tab-wrapper btn-group btn-group-sm"
      role="group"
      animate.enter="anim-scale-in"
      animate.leave="anim-scale-out"
    >
      <button
        class="month-tabs__tab btn tabular-nums"
        [class.btn-primary]="store.activeKey() === tab.key"
        [class.btn-outline-secondary]="store.activeKey() !== tab.key"
        (click)="onTabClick(tab.key)"
      >
        {{ tab.label }}
      </button>
      <button
        type="button"
        class="month-tabs__tab-actions-btn btn"
        [class.btn-primary]="store.activeKey() === tab.key"
        [class.btn-outline-secondary]="store.activeKey() !== tab.key"
        [attr.aria-label]="'monthTabs.actions' | translate"
        (click)="toggleActions(tab, $event)"
      >
        ⋮
      </button>
    </div>
  }
  <button
    class="month-tabs__add-btn btn btn-sm btn-outline-secondary"
    (click)="togglePicker()"
    type="button"
  >
    +
  </button>
  @if (showPicker()) {
    <input
      type="month"
      class="month-tabs__picker form-control form-control-sm"
      (change)="onPickerChange($event)"
      animate.enter="anim-fade-in"
      animate.leave="anim-fade-out"
    />
  }
  @if (pendingDeleteTab(); as tab) {
    <div
      class="month-tabs__confirm-overlay"
      (click)="cancelDelete()"
      animate.enter="anim-fade-in"
      animate.leave="anim-fade-out"
    >
      <div
        class="month-tabs__confirm-modal"
        (click)="onModalContentClick($event)"
        animate.enter="anim-scale-in"
        animate.leave="anim-scale-out"
      >
        <p class="month-tabs__confirm-text">
          {{ 'monthTabs.confirmDelete' | translate: { label: tab.label } }}
        </p>
        <div class="month-tabs__confirm-actions">
          <button
            type="button"
            class="month-tabs__confirm-cancel-btn btn btn-sm btn-outline-secondary"
            (click)="cancelDelete()"
          >
            {{ 'monthTabs.cancel' | translate }}
          </button>
          <button
            type="button"
            class="month-tabs__confirm-delete-btn btn btn-sm btn-danger"
            (click)="confirmDelete()"
          >
            {{ 'monthTabs.delete' | translate }}
          </button>
        </div>
      </div>
    </div>
  }
</div>
