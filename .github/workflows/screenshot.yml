name: Update App Screenshot

on:
  push:
    branches:
      - main

jobs:
  screenshot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build production
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Serve build and take screenshot
        run: |
          npx serve dist -l 4200 &
          sleep 3
          npx node scripts/take-screenshot.mjs

      - name: Commit and push screenshot
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'docs: update app screenshot'
          file_pattern: public/screenshots/app-preview.png
          skip_fetch: false
          skip_checkout: false
